name: Native Build and Publish ocserv

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

# 提取环境变量，避免重复写 Docker Hub 仓库名
env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ocserv

jobs:
  # ==========================================
  # 阶段 1：自动获取最新版本号
  # ==========================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get latest ocserv version
        id: get_version
        run: |
          LATEST_VERSION=$(curl -s "https://gitlab.com/api/v4/projects/openconnect%2Focserv/repository/tags" | jq -r '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$LATEST_VERSION" ]; then
            echo "Error: Failed to fetch version!"
            exit 1
          fi
          echo "Found latest version: $LATEST_VERSION"
          echo "VERSION=$LATEST_VERSION" >> $GITHUB_OUTPUT

  # ==========================================
  # 阶段 2：使用原生服务器并行编译 (Matrix)
  # ==========================================
  build:
    needs: prepare
    strategy:
      # 并行策略：分别在 ubuntu-latest (amd64) 和 ubuntu-24.04-arm (arm64) 上运行
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    
    runs-on: ${{ matrix.runner }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 这里不直接打 Tag，而是通过 push-by-digest 上传数据层
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            OCSERV_VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      # 导出该架构的哈希值 (Digest)
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # 将哈希值作为伪影 (Artifact) 上传，供下一阶段合并
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # 阶段 3：合并 Digest 并打上最终标签
  # ==========================================
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # 下载阶段 2 产生的所有架构的哈希值
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 创建 Manifest 列表，将 amd64 和 arm64 绑定到版本号及 latest 标签，并发布
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
            
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}