name: Build and Publish ocserv to Docker Hub

# 触发条件配置
on:
  # 1. 定时触发：每周日 UTC 时间凌晨 2:00 执行一次 (北京时间上午10点)
  schedule:
    - cron: '0 2 * * 0'
  # 2. 手动触发：允许在 GitHub 网页端手动点击运行
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 自动检测 ocserv 的最新版本号
      - name: Get latest ocserv version
        id: get_version
        run: |
          # 请求 GitLab API 获取 openconnect/ocserv 项目的所有标签，筛选纯数字版本号并取最大值
          LATEST_VERSION=$(curl -s "https://gitlab.com/api/v4/projects/openconnect%2Focserv/repository/tags" | jq -r '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          
          if [ -z "$LATEST_VERSION" ]; then
            echo "Error: Failed to fetch version!"
            exit 1
          fi
          
          echo "Found latest version: $LATEST_VERSION"
          # 将版本号输出为 GitHub Actions 变量，供后续步骤使用
          echo "VERSION=$LATEST_VERSION" >> $GITHUB_OUTPUT

      # 3. 设置 QEMU（用于多架构编译）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. 生成 Docker 镜像的 Tag 标签（动态打上 latest 和 具体版本号）
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ocserv
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_version.outputs.VERSION }}

      # 7. 编译并推送到 Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 核心修改：将动态获取的版本号传给 Dockerfile 中的 ARG OCSERV_VERSION
          build-args: |
            OCSERV_VERSION=${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max